[project]
name = "shopperflox_backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mikhail Mojihen", email = "mojihenjin@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.162.7",
    "loguru>=0.8.0",
    "prometheus-client>=0.26.0",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]
ignore = [
    "E501",
]
