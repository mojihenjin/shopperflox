[project]
name = "shopperflox_backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mikhail Mojihen", email = "mojihenjin@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi[all]>=0.162.7",
    "loguru>=0.8.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.4.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
]


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]
ignore = [
    "E501",
]
