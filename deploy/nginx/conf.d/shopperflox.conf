upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Global security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate-limited auth endpoints
    location ~ ^/api/v1/auth/(login|register|email/send-code|verification-code) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Backend API endpoints
    location /api {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoints
    location /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Prometheus metrics endpoint with protection foundation
    location = /metrics {
        satisfy any;

        # Real IP resolution when deployed behind external reverse proxy / load balancer (e.g. AWS ALB, Cloudflare):
        # set_real_ip_from 10.0.0.0/8;
        # set_real_ip_from 172.16.0.0/12;
        # real_ip_header X-Forwarded-For;
        # real_ip_recursive on;

        # Protection foundation: uncomment below to enable Basic Auth
        # auth_basic "Restricted Metrics";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # Allow localhost and internal Docker subnets
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Local media files
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend root
    location / {
        # Reserved for frontend application (SPA / SSR)
        # proxy_pass http://frontend_upstream;
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>ShopperFlox</title></head><body><h1>ShopperFlox Frontend</h1><p>Frontend service placeholder.</p></body></html>';
    }
}
