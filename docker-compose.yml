services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shopperflox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shopperflox-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopperflox-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://shopperflox:shopperflox@postgres:5432/shopperflox
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/live\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shopperflox-network

  postgres:
    image: postgres:17-alpine
    container_name: shopperflox-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=shopperflox
      - POSTGRES_USER=shopperflox
      - POSTGRES_PASSWORD=shopperflox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopperflox -d shopperflox"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopperflox-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shopperflox-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shopperflox-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shopperflox-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    volumes_from: []
    depends_on:
      - prometheus
    networks:
      - shopperflox-network

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:
  shopperflox-network:
    driver: bridge
